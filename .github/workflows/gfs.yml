name: GFS RSI Scan

on:
  schedule:
    - cron: "15 0 * * *"   # daily - 00:15 UTC, right after the 1D close
  workflow_dispatch:        # manual run
    inputs:
      dry_run:
        description: "Dry run - print the message in the job log, send nothing, write nothing"
        type: boolean
        default: false

# Allow the job to commit state.json / archive / matches log back to the repo.
permissions:
  contents: write

# Shared with the spinning-top workflow so the two commit-backs never race.
concurrency:
  group: gfs-spinning-top-scan
  cancel-in-progress: false

defaults:
  run:
    working-directory: gfs-scanner

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}          # optional free Demo key
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: python scanner.py

      - name: Commit state, archive and matches log
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in state.json alerts_archive.txt matches.jsonl; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: GFS scan - update state + archive [skip ci]"
            git push || (git pull --rebase && git push)
          fi
